<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Сss/Style.css">
    <script src="../Scripts/Script.js"></script>
    <title>To Do List</title>
</head>
<body>
    <main>
        <div class="tasks">
            <div class="task-card-container">
                <div class="task__card">
                    <div class="task__card__data">
                        <h3 class="task__card__title">
                            Заголовок задачи...
                        </h3> 
                        <p class="task__card__description">
                            Тело задачи, краткое описание...
                        </p>
                        <h4 class="task__card__deadline">
                            11.10.2025 - 24.10.2025
                        </h4>
                    </div>
                    <button class="delete__task__button"></button>
                </div>
                <div class="task__card__bellow__buttons">
                    <button class="task__card__buttons"></button>
                    <button class="task__card__buttons"></button>
                    <button class="task__card__buttons"></button>
                </div>
                <div class="tasks__no-tasks">
                    <div class="tasks__no-task__separator"></div>
                    <p>Все задачи выполнены</p>
                    <div class="tasks__no-task__separator"></div>
                </div>
            </div>
        </div>
        <div class="add-task">
            <div class="add__task__data">
                <input type="text" name="" id="">
                <input type="text" name="" id="">
            </div>
            <button class="add__task__button">
                <img src="../Assets/Img/Union.svg" alt="">
            </button>
        </div>
    </main>
</body>
</html>
